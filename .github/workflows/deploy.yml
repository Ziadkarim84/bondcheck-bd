name: CI

on:
  push:
    branches: [main, v2-local-first]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile — type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile

  pipeline:
    name: Pipeline — rebuild site from saved results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: pipeline
      - run: npx tsc
        working-directory: pipeline
